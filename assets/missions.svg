<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1000 660" width="1000" height="660">
<defs>
  <linearGradient id="bgMissions" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#030508"/>
    <stop offset="50%" stop-color="#070b14"/>
    <stop offset="100%" stop-color="#04060a"/>
  </linearGradient>

  <linearGradient id="emberG" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#ff4400"/>
    <stop offset="100%" stop-color="#ffaa00"/>
  </linearGradient>
  <linearGradient id="cyanG" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#00d4ff"/>
    <stop offset="100%" stop-color="#00ffcc"/>
  </linearGradient>

  <pattern id="gridMis" width="24" height="24" patternUnits="userSpaceOnUse">
    <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#ff7700" stroke-width="0.7" stroke-opacity="0.04"/>
  </pattern>

  <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
    <feGaussianBlur stdDeviation="3.5" result="coloredBlur"/>
    <feMerge>
      <feMergeNode in="coloredBlur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>
</defs>

<style>
  .mono { font-family: 'JetBrains Mono', 'SF Pro Mono', Menlo, Consolas, monospace; }
  .display { font-family: 'Arial Black', Impact, 'Trebuchet MS', sans-serif; font-weight: 900; }
  
  @keyframes sweepLine { 0% { transform: translateY(-5px); } 100% { transform: translateY(665px); } }
  @keyframes blinkLed { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0.15; } }
  
  .scanline { animation: sweepLine 6s linear infinite; }
  .blink { animation: blinkLed 1s infinite; }
</style>

<!-- Canvas Base -->
<rect width="1000" height="660" fill="url(#bgMissions)"/>
<rect width="1000" height="660" fill="url(#gridMis)"/>
<rect class="scanline" width="1000" height="2" fill="#ff7700" opacity="0.3"/>

<!-- Hull Frame -->
<polygon points="34,10 966,10 990,34 990,626 966,650 34,650 10,626 10,34" 
         fill="none" stroke="#ff7700" stroke-opacity="0.45" stroke-width="1.5"/>

<!-- Header Section -->
<g transform="translate(42, 42)">
  <text class="mono" font-size="11" letter-spacing="2" fill="#ff7700" font-weight="700">// 06. PRODUCTION SYSTEMS ARSENAL</text>
  <text class="display" font-size="28" fill="#ffffff" y="32">FIVE FLAGSHIP DISTRIBUTED SYSTEMS CODEBASES</text>
  <text class="mono" font-size="12" fill="#94a3b8" y="54">Engineered from foundational mathematical primitives to planetary-scale edge runtimes.</text>
</g>

<!-- TOP RIGHT LIVE CI STATUS PILL -->
<g transform="translate(770, 36)">
  <rect width="188" height="24" rx="4" fill="#10b981" fill-opacity="0.12" stroke="#10b981" stroke-opacity="0.5"/>
  <circle cx="12" cy="12" r="3.5" fill="#10b981" class="blink"/>
  <text x="24" y="16" class="mono" font-size="10" font-weight="700" fill="#a7f3d0">ALL 5 SYSTEMS VERIFIED 100%</text>
</g>

<!-- ROW 1: 2 FLAGSHIP CARDS -->
<!-- 1. HyperRoute Gateway -->
<g transform="translate(42, 120)">
  <polygon points="16,0 440,0 440,220 424,236 0,236 0,16" fill="#070c16" stroke="#ff5500" stroke-opacity="0.6" stroke-width="1.2"/>
  <g transform="translate(20, 20)">
    <rect width="90" height="20" rx="3" fill="#ff5500" fill-opacity="0.15" stroke="#ff5500" stroke-opacity="0.4"/>
    <text x="8" y="14" class="mono" font-size="9" font-weight="700" fill="#fed7aa">GO / C++20</text>
    <rect x="98" width="112" height="20" rx="3" fill="#10b981" fill-opacity="0.12" stroke="#10b981" stroke-opacity="0.4"/>
    <text x="106" y="14" class="mono" font-size="9" font-weight="700" fill="#a7f3d0">p99 &lt; 2.80ms</text>
    <rect x="330" width="70" height="20" rx="3" fill="#00d4ff" fill-opacity="0.15" stroke="#00d4ff" stroke-opacity="0.4"/>
    <circle cx="340" cy="10" r="3" fill="#00ffcc" class="blink"/>
    <text x="348" y="14" class="mono" font-size="8.5" font-weight="700" fill="#00ffcc">ACTIVE</text>

    <text x="0" y="50" class="display" font-size="17" fill="#ffffff">HyperRoute Gateway</text>
    <text x="0" y="70" class="mono" font-size="11" font-weight="700" fill="#ff7700">High-Throughput Edge Reverse Proxy &amp; Rate Limiter</text>
    <text x="0" y="92" class="mono" font-size="10.5" fill="#cbd5e1">Atomic sliding token-bucket rate limiting, zero-allocation memory pools, and sub-second health-checking.</text>

    <line x1="0" y1="120" x2="400" y2="120" stroke="#ffffff" stroke-opacity="0.08"/>

    <g transform="translate(0, 142)">
      <rect width="190" height="42" rx="4" fill="#040810"/>
      <text x="10" y="16" class="mono" font-size="8.5" fill="#94a3b8">PEAK THROUGHPUT</text>
      <text x="10" y="32" class="mono" font-size="12" font-weight="700" fill="#ffaa00">120K rps sustained</text>

      <rect x="206" width="194" height="42" rx="4" fill="#040810"/>
      <text x="216" y="16" class="mono" font-size="8.5" fill="#94a3b8">TELEMETRY EXPORTER</text>
      <text x="216" y="32" class="mono" font-size="12" font-weight="700" fill="#10b981">Prometheus OpenMetrics</text>
    </g>
  </g>
</g>

<!-- 2. NexusCRDT Engine -->
<g transform="translate(518, 120)">
  <polygon points="16,0 440,0 440,220 424,236 0,236 0,16" fill="#070c16" stroke="#00d4ff" stroke-opacity="0.6" stroke-width="1.2"/>
  <g transform="translate(20, 20)">
    <rect width="138" height="20" rx="3" fill="#00d4ff" fill-opacity="0.15" stroke="#00d4ff" stroke-opacity="0.4"/>
    <text x="8" y="14" class="mono" font-size="9" font-weight="700" fill="#00ffcc">TYPESCRIPT / SEC</text>
    <rect x="146" width="112" height="20" rx="3" fill="#10b981" fill-opacity="0.12" stroke="#10b981" stroke-opacity="0.4"/>
    <text x="154" y="14" class="mono" font-size="9" font-weight="700" fill="#a7f3d0">&lt; 48B DELTAS</text>
    <rect x="330" width="70" height="20" rx="3" fill="#00d4ff" fill-opacity="0.15" stroke="#00d4ff" stroke-opacity="0.4"/>
    <circle cx="340" cy="10" r="3" fill="#00ffcc" class="blink"/>
    <text x="348" y="14" class="mono" font-size="8.5" font-weight="700" fill="#00ffcc">ACTIVE</text>

    <text x="0" y="50" class="display" font-size="17" fill="#ffffff">NexusCRDT State Engine</text>
    <text x="0" y="70" class="mono" font-size="11" font-weight="700" fill="#00d4ff">Conflict-Free Replicated State &amp; Canvas</text>
    <text x="0" y="92" class="mono" font-size="10.5" fill="#cbd5e1">State-based LWW-Element-Sets with join-semilattice mathematical convergence guarantees under network partitions.</text>

    <line x1="0" y1="120" x2="400" y2="120" stroke="#ffffff" stroke-opacity="0.08"/>

    <g transform="translate(0, 142)">
      <rect width="190" height="42" rx="4" fill="#040810"/>
      <text x="10" y="16" class="mono" font-size="8.5" fill="#94a3b8">CONSISTENCY MODEL</text>
      <text x="10" y="32" class="mono" font-size="12" font-weight="700" fill="#00ffcc">Strong Eventual (SEC)</text>

      <rect x="206" width="194" height="42" rx="4" fill="#040810"/>
      <text x="216" y="16" class="mono" font-size="8.5" fill="#94a3b8">PARTITION TOLERANCE</text>
      <text x="216" y="32" class="mono" font-size="12" font-weight="700" fill="#10b981">Automatic Tombstone Clean</text>
    </g>
  </g>
</g>

<!-- ROW 2: 2 FLAGSHIP CARDS -->
<!-- 3. AgentForge DAG -->
<g transform="translate(42, 376)">
  <polygon points="16,0 440,0 440,220 424,236 0,236 0,16" fill="#070c16" stroke="#a855f7" stroke-opacity="0.6" stroke-width="1.2"/>
  <g transform="translate(20, 20)">
    <rect width="118" height="20" rx="3" fill="#a855f7" fill-opacity="0.15" stroke="#a855f7" stroke-opacity="0.4"/>
    <text x="8" y="14" class="mono" font-size="9" font-weight="700" fill="#e9d5ff">PYTHON / DAG</text>
    <rect x="126" width="132" height="20" rx="3" fill="#a855f7" fill-opacity="0.12" stroke="#a855f7" stroke-opacity="0.4"/>
    <text x="134" y="14" class="mono" font-size="9" font-weight="700" fill="#c084fc">KAHN SCHEDULER</text>
    <rect x="330" width="70" height="20" rx="3" fill="#00d4ff" fill-opacity="0.15" stroke="#00d4ff" stroke-opacity="0.4"/>
    <circle cx="340" cy="10" r="3" fill="#00ffcc" class="blink"/>
    <text x="348" y="14" class="mono" font-size="8.5" font-weight="700" fill="#00ffcc">ACTIVE</text>

    <text x="0" y="50" class="display" font-size="17" fill="#ffffff">AgentForge DAG Runtime</text>
    <text x="0" y="70" class="mono" font-size="11" font-weight="700" fill="#c084fc">Autonomous Multi-Agent Task Pipeline Scheduler</text>
    <text x="0" y="92" class="mono" font-size="10.5" fill="#cbd5e1">Topological wave-based scheduler computing zero in-degree task waves with strict cycle validation and retry traces.</text>

    <line x1="0" y1="120" x2="400" y2="120" stroke="#ffffff" stroke-opacity="0.08"/>

    <g transform="translate(0, 142)">
      <rect width="190" height="42" rx="4" fill="#040810"/>
      <text x="10" y="16" class="mono" font-size="8.5" fill="#94a3b8">DEADLOCK GUARANTEE</text>
      <text x="10" y="32" class="mono" font-size="12" font-weight="700" fill="#e9d5ff">0 Cyclic Halts</text>

      <rect x="206" width="194" height="42" rx="4" fill="#040810"/>
      <text x="216" y="16" class="mono" font-size="8.5" fill="#94a3b8">COMPLEXITY</text>
      <text x="216" y="32" class="mono" font-size="12" font-weight="700" fill="#10b981">O(V + E) Linear</text>
    </g>
  </g>
</g>

<!-- 4. ProxiSpeak Spatial Gateway -->
<g transform="translate(518, 376)">
  <polygon points="16,0 440,0 440,220 424,236 0,236 0,16" fill="#070c16" stroke="#10b981" stroke-opacity="0.6" stroke-width="1.2"/>
  <g transform="translate(20, 20)">
    <rect width="128" height="20" rx="3" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-opacity="0.4"/>
    <text x="8" y="14" class="mono" font-size="9" font-weight="700" fill="#a7f3d0">WEB AUDIO / RTC</text>
    <rect x="136" width="112" height="20" rx="3" fill="#10b981" fill-opacity="0.12" stroke="#10b981" stroke-opacity="0.4"/>
    <text x="144" y="14" class="mono" font-size="9" font-weight="700" fill="#6ee7b7">&lt; 24ms LATENCY</text>
    <rect x="330" width="70" height="20" rx="3" fill="#00d4ff" fill-opacity="0.15" stroke="#00d4ff" stroke-opacity="0.4"/>
    <circle cx="340" cy="10" r="3" fill="#00ffcc" class="blink"/>
    <text x="348" y="14" class="mono" font-size="8.5" font-weight="700" fill="#00ffcc">ACTIVE</text>

    <text x="0" y="50" class="display" font-size="17" fill="#ffffff">ProxiSpeak Spatial Gateway</text>
    <text x="0" y="70" class="mono" font-size="11" font-weight="700" fill="#10b981">Real-Time Geospatial Proximity Voice Engine</text>
    <text x="0" y="92" class="mono" font-size="10.5" fill="#cbd5e1">2D Euclidean inverse-square falloff attenuation with dynamic HRTF stereo panning and WebSocket broadcast.</text>

    <line x1="0" y1="120" x2="400" y2="120" stroke="#ffffff" stroke-opacity="0.08"/>

    <g transform="translate(0, 142)">
      <rect width="190" height="42" rx="4" fill="#040810"/>
      <text x="10" y="16" class="mono" font-size="8.5" fill="#94a3b8">AUDIO LATENCY</text>
      <text x="10" y="32" class="mono" font-size="12" font-weight="700" fill="#34d399">&lt; 24 ms Real-Time</text>

      <rect x="206" width="194" height="42" rx="4" fill="#040810"/>
      <text x="216" y="16" class="mono" font-size="8.5" fill="#94a3b8">ACOUSTIC MODEL</text>
      <text x="216" y="32" class="mono" font-size="12" font-weight="700" fill="#10b981">Inverse-Square Law</text>
    </g>
  </g>
