<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1000 660" width="1000" height="660">
<defs>
  <linearGradient id="bgMissions" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#030508"/>
    <stop offset="50%" stop-color="#0c0710"/>
    <stop offset="100%" stop-color="#04060a"/>
  </linearGradient>

  <linearGradient id="emberG" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#ff4400"/>
    <stop offset="100%" stop-color="#ff9900"/>
  </linearGradient>

  <pattern id="gridMis" width="24" height="24" patternUnits="userSpaceOnUse">
    <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#ff7700" stroke-width="0.7" stroke-opacity="0.04"/>
  </pattern>

  <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
    <feGaussianBlur stdDeviation="3.5" result="coloredBlur"/>
    <feMerge>
      <feMergeNode in="coloredBlur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>
</defs>

<style>
  .mono { font-family: 'JetBrains Mono', 'SF Pro Mono', Menlo, Consolas, monospace; }
  .display { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Arial Black', Impact, sans-serif; font-weight: 800; }
  
  @keyframes sweepLine { 0% { transform: translateY(-5px); } 100% { transform: translateY(665px); } }
  @keyframes blinkLed { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0.15; } }
  
  .scanline { animation: sweepLine 6s linear infinite; }
  .blink { animation: blinkLed 1s infinite; }
  
  .interactive-card { cursor: pointer; transition: transform 0.2s ease; }
</style>

<!-- Canvas Base -->
<rect width="1000" height="660" fill="url(#bgMissions)"/>
<rect width="1000" height="660" fill="url(#gridMis)"/>
<rect class="scanline" width="1000" height="2" fill="#ff7700" opacity="0.3"/>

<!-- Hull Frame -->
<polygon points="34,10 966,10 990,34 990,626 966,650 34,650 10,626 10,34" 
         fill="none" stroke="#ff7700" stroke-opacity="0.45" stroke-width="1.5"/>

<!-- Header Section (Balanced typography, clear of top-right badge) -->
<g transform="translate(42, 42)">
  <text class="mono" font-size="11" letter-spacing="2" fill="#ff7700" font-weight="700">// 06. PRODUCTION SYSTEMS ARSENAL</text>
  <text class="display" font-size="21" fill="#ffffff" y="30">FLAGSHIP DISTRIBUTED SYSTEMS CODEBASES</text>
  <text class="mono" font-size="11" fill="#94a3b8" y="50">Engineered from foundational mathematical primitives to planetary-scale edge runtimes.</text>
</g>

<!-- TOP RIGHT LIVE CI STATUS PILL -->
<g transform="translate(760, 36)">
  <rect width="198" height="24" rx="4" fill="#10b981" fill-opacity="0.12" stroke="#10b981" stroke-opacity="0.5"/>
  <circle cx="12" cy="12" r="3.5" fill="#10b981" class="blink"/>
  <text x="24" y="16" class="mono" font-size="9.5" font-weight="700" fill="#a7f3d0">ALL 5 SYSTEMS VERIFIED 100%</text>
</g>

