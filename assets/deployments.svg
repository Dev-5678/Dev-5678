<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1000 560" width="1000" height="560">
<defs>
  <linearGradient id="bgDep" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#030508"/>
    <stop offset="50%" stop-color="#070b14"/>
    <stop offset="100%" stop-color="#04060a"/>
  </linearGradient>

  <linearGradient id="emberG" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#ff4400"/>
    <stop offset="50%" stop-color="#ff7700"/>
    <stop offset="100%" stop-color="#ffaa00"/>
  </linearGradient>
  <linearGradient id="cyanG" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#00d4ff"/>
    <stop offset="100%" stop-color="#00ffcc"/>
  </linearGradient>

  <!-- Honeycomb Pattern -->
  <pattern id="hexGridDep" width="28" height="48.497" patternUnits="userSpaceOnUse">
    <path d="M 14 0 L 28 8.08 L 28 24.25 L 14 32.33 L 0 24.25 L 0 8.08 Z M 14 48.5 L 28 40.42 L 28 24.25 L 14 32.33 L 0 24.25 L 0 40.42 Z" 
          fill="none" stroke="#00d4ff" stroke-width="0.7" stroke-opacity="0.035"/>
  </pattern>

  <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
    <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
    <feMerge>
      <feMergeNode in="coloredBlur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>
</defs>

<style>
  .mono { font-family: 'JetBrains Mono', 'SF Pro Mono', Menlo, Consolas, monospace; }
  .display { font-family: 'Arial Black', Impact, 'Trebuchet MS', sans-serif; font-weight: 900; }
  
  @keyframes sweepLine { 0% { transform: translateY(-5px); } 100% { transform: translateY(565px); } }
  @keyframes blinkLed { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0.15; } }
  @keyframes packetFlow { 0% { stroke-dashoffset: 40; } 100% { stroke-dashoffset: 0; } }
  
  .scanline { animation: sweepLine 6s linear infinite; }
  .blink { animation: blinkLed 1s infinite; }
  .flow { animation: packetFlow 1.4s linear infinite; }
</style>

<!-- Canvas Base -->
<rect width="1000" height="560" fill="url(#bgDep)"/>
<rect width="1000" height="560" fill="url(#hexGridDep)"/>
<rect class="scanline" width="1000" height="2" fill="#00d4ff" opacity="0.3"/>

<!-- Hull Frame -->
<polygon points="34,10 966,10 990,34 990,526 966,550 34,550 10,526 10,34" 
         fill="none" stroke="#00d4ff" stroke-opacity="0.4" stroke-width="1.5"/>

<!-- Header Section -->
<g transform="translate(42, 46)">
  <text class="mono" font-size="11" letter-spacing="2" fill="#00d4ff" font-weight="700">// 02. PHYSICAL INFRASTRUCTURE &amp; AVIONICS</text>
  <text class="display" font-size="28" fill="#ffffff" y="32">MISSION-CRITICAL CIVIL AVIATION &amp; AEROSPACE TELEMETRY</text>
  <text class="mono" font-size="12" fill="#94a3b8" y="54">Air Navigation Services flight radar defense &amp; 433.92 MHz UHF satellite transceivers.</text>
</g>

<!-- LEFT CARD: AIRPORTS AUTHORITY OF INDIA (NORTHERN REGION HQ) -->
<g transform="translate(42, 120)">
  <polygon points="20,0 440,0 440,390 420,410 0,410 0,20" fill="#070c16" stroke="#00d4ff" stroke-opacity="0.6" stroke-width="1.2"/>
  <g transform="translate(24, 24)">
    <!-- Header Badges -->
    <g>
      <rect width="130" height="20" rx="3" fill="#00d4ff" fill-opacity="0.15" stroke="#00d4ff" stroke-opacity="0.5"/>
      <text x="8" y="14" class="mono" font-size="9" font-weight="700" fill="#00ffcc">CIVIL AVIATION ANS</text>

      <rect x="140" width="90" height="20" rx="3" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-opacity="0.5"/>
      <text x="148" y="14" class="mono" font-size="9" font-weight="700" fill="#a7f3d0">99.98% SLA</text>
    </g>

    <text x="0" y="52" class="display" font-size="20" fill="#ffffff">Airports Authority of India</text>
    <text x="0" y="72" class="mono" font-size="11" font-weight="700" fill="#00d4ff">Northern Region HQ (CNS/ATM Division)</text>
    <text x="0" y="90" class="mono" font-size="10.5" fill="#94a3b8">Location: New Delhi, India · ICAO Annex 10 Compliance</text>

    <line x1="0" y1="104" x2="390" y2="104" stroke="#ffffff" stroke-opacity="0.08"/>

    <!-- Interactive Subnet Isolation Graphic (Different from anyone else!) -->
    <g transform="translate(0, 116)">
      <rect width="390" height="66" rx="6" fill="#040810" stroke="#00d4ff" stroke-opacity="0.25"/>
      <!-- Admin VLAN -->
      <rect x="12" y="12" width="165" height="42" rx="4" fill="#1e293b" fill-opacity="0.6"/>
      <text x="22" y="28" class="mono" font-size="9" font-weight="700" fill="#94a3b8">VLAN 10: ATM ADMIN</text>
      <text x="22" y="44" class="mono" font-size="8.5" fill="#64748b">172.16.0.0/20 [Isolated]</text>

      <!-- Firewall Barrier -->
      <line x1="195" y1="10" x2="195" y2="56" stroke="#ef4444" stroke-width="2" stroke-dasharray="3 3"/>
      <text x="195" y="62" class="mono" font-size="7.5" fill="#ef4444" text-anchor="middle">ACL BARRIER</text>

      <!-- Radar Telemetry VLAN -->
      <rect x="212" y="12" width="165" height="42" rx="4" fill="#03253d" stroke="#00d4ff" stroke-opacity="0.4"/>
      <text x="222" y="28" class="mono" font-size="9" font-weight="700" fill="#00ffcc">VLAN 50: RADAR ANS</text>
      <text x="222" y="44" class="mono" font-size="8.5" fill="#38bdf8">10.240.0.0/22 [ADS-B Feed]</text>
    </g>

    <!-- Engineering Specs & Accomplishments -->
    <g transform="translate(0, 204)">
      <circle cx="5" cy="5" r="3" fill="#00d4ff"/>
      <text x="16" y="9" class="mono" font-size="11" font-weight="700" fill="#ffffff">Air-Gapped Subnet Boundary Enforcement</text>
      <text x="16" y="26" class="mono" font-size="10.5" fill="#94a3b8">Eliminated lateral attack vectors into primary surveillance radar feeds.</text>

      <circle cx="5" cy="50" r="3" fill="#00d4ff"/>
      <text x="16" y="54" class="mono" font-size="11" font-weight="700" fill="#ffffff">Zero-Packet-Drop VHF Communication Bridges</text>
      <text x="16" y="71" class="mono" font-size="10.5" fill="#94a3b8">Mitigated broadcast storm loops and packet jitter across voice channels.</text>

      <circle cx="5" cy="95" r="3" fill="#00d4ff"/>
      <text x="16" y="99" class="mono" font-size="11" font-weight="700" fill="#ffffff">99.98% Operational Uptime SLA Assurance</text>
      <text x="16" y="116" class="mono" font-size="10.5" fill="#94a3b8">Continuous SNMPv3 telemetry monitoring with sub-second failover.</text>

      <circle cx="5" cy="140" r="3" fill="#00d4ff"/>
      <text x="16" y="144" class="mono" font-size="11" font-weight="700" fill="#ffffff">ATC Console Lockdown &amp; ICAO Annex 10 Compliance</text>
      <text x="16" y="161" class="mono" font-size="10.5" fill="#94a3b8">Hardened mission-critical Air Traffic Control display workstations.</text>
    </g>
  </g>
</g>

<!-- RIGHT CARD: INDIA SPACE LAB (ISL) SATELLITE TELEMETRY -->
<g transform="translate(518, 120)">
  <polygon points="20,0 440,0 440,390 420,410 0,410 0,20" fill="#070c16" stroke="#ff5500" stroke-opacity="0.6" stroke-width="1.2"/>
  <g transform="translate(24, 24)">
    <!-- Header Badges -->
    <g>
      <rect width="136" height="20" rx="3" fill="#ff5500" fill-opacity="0.15" stroke="#ff5500" stroke-opacity="0.5"/>
      <text x="8" y="14" class="mono" font-size="9" font-weight="700" fill="#fed7aa">SATELLITE SYSTEMS</text>

      <rect x="146" width="126" height="20" rx="3" fill="#f59e0b" fill-opacity="0.15" stroke="#f59e0b" stroke-opacity="0.5"/>
      <text x="154" y="14" class="mono" font-size="9" font-weight="700" fill="#fde68a">433.92 MHz UHF</text>
    </g>

    <text x="0" y="52" class="display" font-size="20" fill="#ffffff">India Space Lab (ISL)</text>
    <text x="0" y="72" class="mono" font-size="11" font-weight="700" fill="#ff5500">Autonomous Satellite Systems Division</text>
    <text x="0" y="90" class="mono" font-size="10.5" fill="#94a3b8">Role: 1U CanSat &amp; CubeSat Telemetry Engineer · Bengaluru</text>

    <line x1="0" y1="104" x2="390" y2="104" stroke="#ffffff" stroke-opacity="0.08"/>

    <!-- Interactive Radio Packet Protocol Breakdown (Totally Unique!) -->
    <g transform="translate(0, 116)">
      <rect width="390" height="66" rx="6" fill="#040810" stroke="#ff5500" stroke-opacity="0.25"/>
      
      <!-- Packet Frame Fields -->
      <g transform="translate(8, 14)">
        <rect width="60" height="38" rx="3" fill="#1e293b"/>
        <text x="30" y="18" class="mono" font-size="8" fill="#94a3b8" text-anchor="middle">PREAMBLE</text>
        <text x="30" y="31" class="mono" font-size="8.5" font-weight="700" fill="#ffffff" text-anchor="middle">0xAA</text>

        <rect x="66" width="70" height="38" rx="3" fill="#1e293b"/>
        <text x="101" y="18" class="mono" font-size="8" fill="#94a3b8" text-anchor="middle">SYNC WORD</text>
        <text x="101" y="31" class="mono" font-size="8.5" font-weight="700" fill="#00d4ff" text-anchor="middle">0xD391</text>

        <rect x="142" width="165" height="38" rx="3" fill="#2d1202" stroke="#ff5500" stroke-opacity="0.5"/>
        <text x="224" y="18" class="mono" font-size="8" fill="#fed7aa" text-anchor="middle">PAYLOAD TELEMETRY</text>
        <text x="224" y="31" class="mono" font-size="8" font-weight="700" fill="#ffaa00" text-anchor="middle">BMP280 · MPU6050 · GPS</text>

        <rect x="313" width="60" height="38" rx="3" fill="#1e293b"/>
        <text x="343" y="18" class="mono" font-size="8" fill="#94a3b8" text-anchor="middle">CRC-16</text>
        <text x="343" y="31" class="mono" font-size="8.5" font-weight="700" fill="#10b981" text-anchor="middle">VERIFIED</text>
      </g>
    </g>

    <!-- Engineering Specs & Accomplishments -->
    <g transform="translate(0, 204)">
      <circle cx="5" cy="5" r="3" fill="#ff5500"/>
      <text x="16" y="9" class="mono" font-size="11" font-weight="700" fill="#ffffff">Real-Time Sensor Bus Ingestion Architecture</text>
      <text x="16" y="26" class="mono" font-size="10.5" fill="#94a3b8">Integrated multi-sensor I2C/SPI bus for BMP280 barometer &amp; MPU6050 IMU.</text>

      <circle cx="5" cy="50" r="3" fill="#ff5500"/>
      <text x="16" y="54" class="mono" font-size="11" font-weight="700" fill="#ffffff">433.92 MHz UHF Radio Transceiver Demodulation</text>
      <text x="16" y="71" class="mono" font-size="10.5" fill="#94a3b8">Engineered 9600 baud packet framing decoder with Forward Error Correction.</text>

      <circle cx="5" cy="95" r="3" fill="#ff5500"/>
      <text x="16" y="99" class="mono" font-size="11" font-weight="700" fill="#ffffff">Ground Station Real-Time Telemetry Stream</text>
      <text x="16" y="116" class="mono" font-size="10.5" fill="#94a3b8">Visualized real-time altitude, descent speed &amp; 3-axis attitude telemetry.</text>

      <circle cx="5" cy="140" r="3" fill="#ff5500"/>
      <text x="16" y="144" class="mono" font-size="11" font-weight="700" fill="#ffffff">Dual Recovery Parachute Deployment Logic</text>
      <text x="16" y="161" class="mono" font-size="10.5" fill="#94a3b8">Programmed barometric apogee detection for automated soft touchdown.</text>
    </g>
  </g>
</g>
</svg>