<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1000 560" width="1000" height="560">
<defs>
  <linearGradient id="bgDep" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#030508"/>
    <stop offset="50%" stop-color="#070b14"/>
    <stop offset="100%" stop-color="#04060a"/>
  </linearGradient>

  <linearGradient id="emberG" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#ff4400"/>
    <stop offset="50%" stop-color="#ff7700"/>
    <stop offset="100%" stop-color="#ffaa00"/>
  </linearGradient>
  <linearGradient id="cyanG" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#00d4ff"/>
    <stop offset="100%" stop-color="#00ffcc"/>
  </linearGradient>

  <!-- Honeycomb Pattern -->
  <pattern id="hexGridDep" width="28" height="48.497" patternUnits="userSpaceOnUse">
    <path d="M 14 0 L 28 8.08 L 28 24.25 L 14 32.33 L 0 24.25 L 0 8.08 Z M 14 48.5 L 28 40.42 L 28 24.25 L 14 32.33 L 0 24.25 L 0 40.42 Z" 
          fill="none" stroke="#00d4ff" stroke-width="0.7" stroke-opacity="0.035"/>
  </pattern>

  <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
    <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
    <feMerge>
      <feMergeNode in="coloredBlur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>
</defs>

<style>
  .mono { font-family: 'JetBrains Mono', 'SF Pro Mono', Menlo, Consolas, monospace; }
  .display { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Arial Black', Impact, sans-serif; font-weight: 800; }
  
  @keyframes sweepLine { 0% { transform: translateY(-5px); } 100% { transform: translateY(565px); } }
  @keyframes blinkLed { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0.15; } }
  @keyframes packetFlow { 0% { stroke-dashoffset: 40; } 100% { stroke-dashoffset: 0; } }
  
  .scanline { animation: sweepLine 6s linear infinite; }
  .blink { animation: blinkLed 1s infinite; }
  .flow { animation: packetFlow 1.4s linear infinite; }
</style>

<!-- Canvas Base -->
<rect width="1000" height="560" fill="url(#bgDep)"/>
<rect width="1000" height="560" fill="url(#hexGridDep)"/>
<rect class="scanline" width="1000" height="2" fill="#00d4ff" opacity="0.3"/>

<!-- Hull Frame -->
<polygon points="34,10 966,10 990,34 990,526 966,550 34,550 10,526 10,34" 
         fill="none" stroke="#00d4ff" stroke-opacity="0.4" stroke-width="1.5"/>

<!-- Header Section -->
<g transform="translate(42, 42)">
  <text class="mono" font-size="11" letter-spacing="2" fill="#00d4ff" font-weight="700">// 02. PHYSICAL INFRASTRUCTURE &amp; AVIONICS</text>
  <text class="display" font-size="21" fill="#ffffff" y="30">CIVIL AVIATION ANS RADAR &amp; TELEMETRY</text>
  <text class="mono" font-size="11" fill="#94a3b8" y="50">Air Navigation Services flight radar defense &amp; 433.92 MHz UHF satellite transceivers.</text>
</g>

<!-- Top Right Radar Defense Status Pill -->
<g transform="translate(760, 36)">
  <rect width="198" height="24" rx="4" fill="#00d4ff" fill-opacity="0.12" stroke="#00d4ff" stroke-opacity="0.5"/>
  <circle cx="12" cy="12" r="3.5" fill="#00ffcc" class="blink"/>
  <text x="24" y="16" class="mono" font-size="9.5" font-weight="700" fill="#00ffcc">RADAR DEFENSE // ACTIVE</text>
</g>

<!-- LEFT CARD: AIRPORTS AUTHORITY OF INDIA (NORTHERN REGION HQ) -->
<g transform="translate(42, 118)">
  <polygon points="20,0 445,0 445,396 425,416 0,416 0,20" fill="#070c16" stroke="#00d4ff" stroke-opacity="0.6" stroke-width="1.2"/>
  <g transform="translate(22, 22)">
    <!-- Header Badges -->
    <g>
      <rect width="130" height="20" rx="3" fill="#00d4ff" fill-opacity="0.15" stroke="#00d4ff" stroke-opacity="0.5"/>
      <text x="8" y="14" class="mono" font-size="9" font-weight="700" fill="#00ffcc">CIVIL AVIATION ANS</text>

      <rect x="140" width="135" height="20" rx="3" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-opacity="0.5"/>
      <text x="147" y="14" class="mono" font-size="8.5" font-weight="700" fill="#a7f3d0">14 AUG – 25 SEP 2026</text>
    </g>

    <text x="0" y="48" class="display" font-size="19" fill="#ffffff">Airports Authority of India</text>
    <text x="0" y="66" class="mono" font-size="10.5" font-weight="700" fill="#00d4ff">Northern Region HQ (CNS/ATM Division)</text>
    <text x="0" y="82" class="mono" font-size="10" fill="#94a3b8">Location: New Delhi / NCR · ICAO Annex 10 Doc 9684</text>

    <line x1="0" y1="96" x2="400" y2="96" stroke="#ffffff" stroke-opacity="0.08"/>

    <!-- Subnet Isolation Graphic -->
    <g transform="translate(0, 106)">
      <rect width="400" height="66" rx="6" fill="#040810" stroke="#00d4ff" stroke-opacity="0.25"/>
      <!-- Admin VLAN -->
      <rect x="10" y="12" width="170" height="42" rx="4" fill="#1e293b" fill-opacity="0.6"/>
      <text x="20" y="28" class="mono" font-size="8.5" font-weight="700" fill="#94a3b8">VLAN 10: ATM ADMIN</text>
      <text x="20" y="44" class="mono" font-size="8" fill="#64748b">172.16.0.0/20 [Isolated]</text>

      <!-- Firewall Barrier -->
      <line x1="200" y1="10" x2="200" y2="56" stroke="#ef4444" stroke-width="2" stroke-dasharray="3 3"/>
      <text x="200" y="62" class="mono" font-size="7.5" fill="#ef4444" text-anchor="middle">ACL BARRIER</text>

      <!-- Radar Telemetry VLAN -->
      <rect x="220" y="12" width="170" height="42" rx="4" fill="#03253d" stroke="#00d4ff" stroke-opacity="0.4"/>
      <text x="230" y="28" class="mono" font-size="8.5" font-weight="700" fill="#00ffcc">VLAN 50: RADAR ANS</text>
      <text x="230" y="44" class="mono" font-size="8" fill="#38bdf8">10.240.0.0/22 [ADS-B Feed]</text>
    </g>

    <!-- Engineering Specs & Accomplishments (Cleanly wrapped) -->
    <g transform="translate(0, 192)">
      <!-- Point 1 -->
      <circle cx="5" cy="5" r="3" fill="#00d4ff"/>
      <text x="16" y="9" class="mono" font-size="10" font-weight="700" fill="#ffffff">Air-Gapped Subnet Boundary Enforcement</text>
      <text x="16" y="24" class="mono" font-size="9" fill="#94a3b8">Eliminated lateral attack vectors into primary</text>
      <text x="16" y="38" class="mono" font-size="9" fill="#94a3b8">Air Navigation Services surveillance radar feeds.</text>

      <!-- Point 2 -->
      <circle cx="5" cy="58" r="3" fill="#00d4ff"/>
      <text x="16" y="62" class="mono" font-size="10" font-weight="700" fill="#ffffff">Zero-Packet-Drop VHF Communication Bridges</text>
      <text x="16" y="77" class="mono" font-size="9" fill="#94a3b8">Mitigated broadcast storm loops and packet jitter</text>
      <text x="16" y="91" class="mono" font-size="9" fill="#94a3b8">across critical air traffic voice channels.</text>

      <!-- Point 3 -->
      <circle cx="5" cy="111" r="3" fill="#00d4ff"/>
      <text x="16" y="115" class="mono" font-size="10" font-weight="700" fill="#ffffff">99.98% Operational Uptime SLA Assurance</text>
      <text x="16" y="130" class="mono" font-size="9" fill="#94a3b8">Continuous SNMPv3 telemetry monitoring with</text>
      <text x="16" y="144" class="mono" font-size="9" fill="#94a3b8">sub-second automated link failover.</text>

      <!-- Tech Stack Pill -->
      <g transform="translate(0, 160)">
        <rect width="400" height="24" rx="4" fill="#00d4ff" fill-opacity="0.08"/>
        <text x="10" y="16" class="mono" font-size="8.5" fill="#00d4ff" font-weight="700">TECH: CISCO IOS-XE • 802.1Q • SNMPv3 • OSPFv3 • WIRESHARK</text>
      </g>
    </g>
  </g>
</g>

<!-- RIGHT CARD: INDIA SPACE LAB (ISL) CANSAT TELEMETRY -->
<g transform="translate(513, 118)">
  <polygon points="20,0 445,0 445,396 425,416 0,416 0,20" fill="#070c16" stroke="#ff5500" stroke-opacity="0.6" stroke-width="1.2"/>
  <g transform="translate(22, 22)">
    <!-- Header Badges -->
    <g>
      <rect width="138" height="20" rx="3" fill="#ff5500" fill-opacity="0.15" stroke="#ff5500" stroke-opacity="0.5"/>
      <text x="8" y="14" class="mono" font-size="9" font-weight="700" fill="#ffaa00">SPACE TECH INTERN</text>

      <rect x="148" width="135" height="20" rx="3" fill="#00d4ff" fill-opacity="0.15" stroke="#00d4ff" stroke-opacity="0.5"/>
      <text x="155" y="14" class="mono" font-size="8.5" font-weight="700" fill="#00d4ff">15 JUL – 31 JUL 2025</text>
    </g>

    <text x="0" y="48" class="display" font-size="19" fill="#ffffff">India Space Lab (ISL)</text>
    <text x="0" y="66" class="mono" font-size="10.5" font-weight="700" fill="#ff7700">Autonomous Satellite &amp; Telemetry Payload</text>
    <text x="0" y="82" class="mono" font-size="10" fill="#94a3b8">Payload: 1U CanSat / CubeSat · UHF 433.92 MHz</text>

    <line x1="0" y1="96" x2="400" y2="96" stroke="#ffffff" stroke-opacity="0.08"/>

    <!-- UHF Telemetry Packet Structure -->
    <g transform="translate(0, 106)">
      <rect width="400" height="66" rx="6" fill="#040810" stroke="#ff5500" stroke-opacity="0.25"/>
      <g transform="translate(8, 10)">
        <rect width="56" height="46" rx="3" fill="#331400" stroke="#ff5500" stroke-opacity="0.5"/>
        <text x="28" y="24" class="mono" font-size="8" font-weight="700" fill="#fed7aa" text-anchor="middle">PREAMBLE</text>
        <text x="28" y="38" class="mono" font-size="7" fill="#f97316" text-anchor="middle">0xAA 0x55</text>

        <rect x="66" width="68" height="46" rx="3" fill="#1e293b"/>
        <text x="100" y="24" class="mono" font-size="8" font-weight="700" fill="#cbd5e1" text-anchor="middle">BMP280</text>
        <text x="100" y="38" class="mono" font-size="7" fill="#94a3b8" text-anchor="middle">BARO/ALT</text>

        <rect x="144" width="70" height="46" rx="3" fill="#1e293b"/>
        <text x="179" y="24" class="mono" font-size="8" font-weight="700" fill="#cbd5e1" text-anchor="middle">MPU6050</text>
        <text x="179" y="38" class="mono" font-size="7" fill="#94a3b8" text-anchor="middle">6-DOF IMU</text>

        <rect x="224" width="84" height="46" rx="3" fill="#022c22" stroke="#10b981" stroke-opacity="0.5"/>
        <text x="266" y="24" class="mono" font-size="8" font-weight="700" fill="#6ee7b7" text-anchor="middle">DESCENT</text>
        <text x="266" y="38" class="mono" font-size="7" fill="#10b981" text-anchor="middle">PARACHUTE</text>

        <rect x="318" width="66" height="46" rx="3" fill="#331400" stroke="#ff5500" stroke-opacity="0.5"/>
        <text x="351" y="24" class="mono" font-size="8" font-weight="700" fill="#fed7aa" text-anchor="middle">CRC-16</text>
        <text x="351" y="38" class="mono" font-size="7" fill="#f97316" text-anchor="middle">CHECKSUM</text>
      </g>
    </g>

    <!-- Engineering Specs & Accomplishments (Cleanly wrapped) -->
    <g transform="translate(0, 192)">
      <!-- Point 1 -->
      <circle cx="5" cy="5" r="3" fill="#ff7700"/>
      <text x="16" y="9" class="mono" font-size="10" font-weight="700" fill="#ffffff">Sub-Second UHF 433.92 MHz Telemetry Link</text>
      <text x="16" y="24" class="mono" font-size="9" fill="#94a3b8">FSK transceiver processing live atmospheric</text>
      <text x="16" y="38" class="mono" font-size="9" fill="#94a3b8">pressure and 3-axis gyro motion telemetry.</text>

      <!-- Point 2 -->
      <circle cx="5" cy="58" r="3" fill="#ff7700"/>
      <text x="16" y="62" class="mono" font-size="10" font-weight="700" fill="#ffffff">Automated Dual-Stage Parachute Deployment</text>
      <text x="16" y="77" class="mono" font-size="9" fill="#94a3b8">Barometric delta trigger deployed soft-landing</text>
      <text x="16" y="91" class="mono" font-size="9" fill="#94a3b8">drogue parachute below 500m apogee.</text>

      <!-- Point 3 -->
      <circle cx="5" cy="111" r="3" fill="#ff7700"/>
      <text x="16" y="115" class="mono" font-size="10" font-weight="700" fill="#ffffff">100% On-Target Data Frame Capture</text>
      <text x="16" y="130" class="mono" font-size="9" fill="#94a3b8">Zero corrupted frames with CRC-16 parity</text>
      <text x="16" y="144" class="mono" font-size="9" fill="#94a3b8">verification across 9600 baud binary link.</text>

      <!-- Tech Stack Pill -->
      <g transform="translate(0, 160)">
        <rect width="400" height="24" rx="4" fill="#ff5500" fill-opacity="0.08"/>
        <text x="10" y="16" class="mono" font-size="8.5" fill="#ff7700" font-weight="700">TECH: C++ • ARDUINO • LORA/FSK • BMP280 • MPU6050 • PYTHON</text>
      </g>
    </g>
  </g>
</g>
</svg>