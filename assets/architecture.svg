<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1000 580" width="1000" height="580">
<defs>
  <linearGradient id="bgMesh" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#030508"/>
    <stop offset="50%" stop-color="#060c14"/>
    <stop offset="100%" stop-color="#04060a"/>
  </linearGradient>

  <linearGradient id="meshGrad" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#00d4ff"/>
    <stop offset="50%" stop-color="#3b82f6"/>
    <stop offset="100%" stop-color="#00ffcc"/>
  </linearGradient>

  <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
    <feGaussianBlur stdDeviation="3.5" result="coloredBlur"/>
    <feMerge>
      <feMergeNode in="coloredBlur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>

  <pattern id="gridMesh" width="24" height="24" patternUnits="userSpaceOnUse">
    <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#00d4ff" stroke-width="0.7" stroke-opacity="0.04"/>
  </pattern>
</defs>

<style>
  .mono { font-family: 'JetBrains Mono', 'SF Pro Mono', Menlo, Consolas, monospace; }
  .display { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Arial Black', Impact, sans-serif; font-weight: 800; }
  
  @keyframes sweepLine { 0% { transform: translateY(-5px); } 100% { transform: translateY(585px); } }
  @keyframes blinkLed { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0.15; } }
  
  .scanline { animation: sweepLine 6s linear infinite; }
  .blink { animation: blinkLed 1s infinite; }
</style>

<!-- Canvas Base -->
<rect width="1000" height="580" fill="url(#bgMesh)"/>
<rect width="1000" height="580" fill="url(#gridMesh)"/>
<rect class="scanline" width="1000" height="2" fill="#00d4ff" opacity="0.3"/>

<!-- Hull Frame -->
<polygon points="34,10 966,10 990,34 990,546 966,570 34,570 10,546 10,34" 
         fill="none" stroke="#00d4ff" stroke-opacity="0.45" stroke-width="1.5"/>

<!-- Header Section (Balanced font-size 21 to avoid colliding with top-right pill badge) -->
<g transform="translate(42, 42)">
  <text class="mono" font-size="11" letter-spacing="2" fill="#00d4ff" font-weight="700">// 05. DISTRIBUTED STATE ARCHITECTURE &amp; TOPOLOGY</text>
  <text class="display" font-size="21" fill="#ffffff" y="30">CRDT GOSSIP MESH &amp; KAHN DAG SCHEDULER</text>
  <text class="mono" font-size="11" fill="#94a3b8" y="50">Strong Eventual Consistency (SEC) under network partitions and zero cyclic deadlocks.</text>
</g>

<!-- TOP RIGHT CAP AP PILL -->
<g transform="translate(770, 36)">
  <rect width="188" height="24" rx="4" fill="#00d4ff" fill-opacity="0.12" stroke="#00d4ff" stroke-opacity="0.5"/>
  <circle cx="12" cy="12" r="3.5" fill="#00ffcc" class="blink"/>
  <text x="24" y="16" class="mono" font-size="10" font-weight="700" fill="#00ffcc">CAP: AP PARTITION-TOLERANT</text>
</g>

<!-- LEFT: DECENTRALIZED MESH TOPOLOGY WITH ANIMATED PACKET PULSES -->
<g transform="translate(42, 118)">
  <rect width="440" height="424" rx="8" fill="#040810" stroke="#00d4ff" stroke-opacity="0.35" stroke-width="1.2"/>
  
  <g transform="translate(20, 20)">
    <text class="mono" font-size="10" fill="#00ffcc" font-weight="700">NEXUSCRDT GOSSIP MESH &amp; LWW SEMILATTICE</text>

    <!-- Mesh Graph Connections with Animated Packets -->
    <g transform="translate(200, 150)">
      <!-- Edges -->
      <line x1="-120" y1="-70" x2="120" y2="-70" stroke="#00d4ff" stroke-opacity="0.3" stroke-width="1.5"/>
      <line x1="-120" y1="-70" x2="0" y2="70" stroke="#00d4ff" stroke-opacity="0.3" stroke-width="1.5"/>
      <line x1="120" y1="-70" x2="0" y2="70" stroke="#00d4ff" stroke-opacity="0.3" stroke-width="1.5"/>
      <line x1="-120" y1="-70" x2="-20" y2="-10" stroke="#ff5500" stroke-opacity="0.25" stroke-dasharray="3 3"/>
      <line x1="120" y1="-70" x2="-20" y2="-10" stroke="#ff5500" stroke-opacity="0.25" stroke-dasharray="3 3"/>
      <line x1="0" y1="70" x2="-20" y2="-10" stroke="#ff5500" stroke-opacity="0.25" stroke-dasharray="3 3"/>

      <!-- Animated Traveling Packet 1: Node A -> Node B -->
      <circle r="4" fill="#00ffcc" filter="url(#neonGlow)">
        <animateMotion path="M -120 -70 L 120 -70" dur="2s" repeatCount="indefinite"/>
      </circle>

      <!-- Animated Traveling Packet 2: Node B -> Node C -->
      <circle r="4" fill="#ff7700" filter="url(#neonGlow)">
        <animateMotion path="M 120 -70 L 0 70" dur="2.4s" repeatCount="indefinite"/>
      </circle>

      <!-- Animated Traveling Packet 3: Node C -> Node A -->
      <circle r="4" fill="#10b981" filter="url(#neonGlow)">
        <animateMotion path="M 0 70 L -120 -70" dur="2.8s" repeatCount="indefinite"/>
      </circle>

      <!-- Node A: US-East Edge Proxy -->
      <g transform="translate(-120, -70)">
        <circle r="22" fill="#070c16" stroke="#00d4ff" stroke-width="2"/>
        <text class="display" font-size="10" fill="#ffffff" text-anchor="middle" y="4">NODE-A</text>
        <text class="mono" font-size="8" fill="#94a3b8" text-anchor="middle" y="32">US-EAST</text>
      </g>

      <!-- Node B: EU-Central Edge Proxy -->
      <g transform="translate(120, -70)">
        <circle r="22" fill="#070c16" stroke="#00d4ff" stroke-width="2"/>
        <text class="display" font-size="10" fill="#ffffff" text-anchor="middle" y="4">NODE-B</text>
        <text class="mono" font-size="8" fill="#94a3b8" text-anchor="middle" y="32">EU-CENTRAL</text>
      </g>

      <!-- Node C: AP-South Edge Proxy (Faridabad / NCR) -->
      <g transform="translate(0, 70)">
        <circle r="26" fill="#070c16" stroke="#ff5500" stroke-width="2.5" filter="url(#neonGlow)"/>
        <circle r="6" fill="#ff5500" class="blink"/>
        <text class="display" font-size="10" fill="#ffffff" text-anchor="middle" y="4">NODE-C</text>
        <text class="mono" font-size="8" fill="#fed7aa" text-anchor="middle" y="34">FARIDABAD [NCR]</text>
      </g>

      <!-- Node D: Decentralized State Arbiter -->
      <g transform="translate(-20, -10)">
        <circle r="16" fill="#1e1b4b" stroke="#a855f7" stroke-width="1.5"/>
        <text class="display" font-size="9" fill="#e9d5ff" text-anchor="middle" y="3">SYNC</text>
      </g>
    </g>

    <!-- Mathematical LWW Semilattice Convergence Proof -->
    <g transform="translate(0, 275)">
      <rect width="400" height="100" rx="6" fill="#021422" stroke="#00d4ff" stroke-opacity="0.3"/>
      <g transform="translate(14, 18)">
        <text class="mono" font-size="9.5" font-weight="700" fill="#00ffcc">JOIN-SEMILATTICE CONVERGENCE THEOREM</text>
        <text class="mono" font-size="9" fill="#94a3b8" y="20">
          • Commutativity: <tspan fill="#ffffff">A ⊔ B = B ⊔ A</tspan>
        </text>
        <text class="mono" font-size="9" fill="#94a3b8" y="36">
          • Associativity: <tspan fill="#ffffff">(A ⊔ B) ⊔ C = A ⊔ (B ⊔ C)</tspan>
        </text>
        <text class="mono" font-size="9" fill="#94a3b8" y="52">
          • Idempotence: <tspan fill="#ffffff">A ⊔ A = A</tspan> (Zero duplicated updates)
        </text>
        <text class="mono" font-size="8.5" fill="#10b981" y="70">
          ✓ Verified SEC: Concurrent merges yield identical bits.
        </text>
      </g>
    </g>
  </g>
</g>

<!-- RIGHT: KAHN DAG TOPOLOGICAL SCHEDULER & WAVE DISPATCH -->
<g transform="translate(506, 118)">
  <rect width="452" height="424" rx="8" fill="#070c16" stroke="#00d4ff" stroke-opacity="0.35" stroke-width="1.2"/>
  
  <g transform="translate(20, 20)">
    <text class="mono" font-size="10" fill="#00d4ff" font-weight="700">AGENTFORGE KAHN DAG TOPOLOGICAL SCHEDULER</text>
    <text class="mono" font-size="9" fill="#64748b" y="16">Cycle-free concurrent workflow execution engine</text>

    <!-- DAG Pipeline Graph Nodes -->
    <g transform="translate(0, 42)">
      <!-- Wave 0: Root Tasks -->
      <g transform="translate(0, 0)">
        <rect width="180" height="42" rx="4" fill="#042f2e" stroke="#10b981" stroke-opacity="0.5"/>
        <text x="12" y="18" class="mono" font-size="9" font-weight="700" fill="#a7f3d0">TASK_01: INGEST</text>
        <text x="12" y="32" class="mono" font-size="8" fill="#6ee7b7">In-degree: 0 [Ready] • Wave 0</text>
      </g>

      <g transform="translate(230, 0)">
        <rect width="180" height="42" rx="4" fill="#042f2e" stroke="#10b981" stroke-opacity="0.5"/>
        <text x="12" y="18" class="mono" font-size="9" font-weight="700" fill="#a7f3d0">TASK_02: TELEMETRY</text>
        <text x="12" y="32" class="mono" font-size="8" fill="#6ee7b7">In-degree: 0 [Ready] • Wave 0</text>
      </g>

      <!-- Connecting Flow Arrows -->
      <path d="M 90 42 L 90 74 L 140 74 L 140 96" fill="none" stroke="#10b981" stroke-width="1.5" stroke-dasharray="3 3"/>
      <path d="M 320 42 L 320 74 L 270 74 L 270 96" fill="none" stroke="#10b981" stroke-width="1.5" stroke-dasharray="3 3"/>

      <!-- Wave 1: Dependent Transform Task -->
      <g transform="translate(115, 96)">
        <rect width="180" height="42" rx="4" fill="#172554" stroke="#3b82f6" stroke-opacity="0.5"/>
        <text x="12" y="18" class="mono" font-size="9" font-weight="700" fill="#93c5fd">TASK_03: TRANSFORM</text>
        <text x="12" y="32" class="mono" font-size="8" fill="#60a5fa">In-degree: 2 -> 0 • Wave 1</text>
      </g>

      <!-- Connecting Flow Arrows to Sinks -->
      <path d="M 205 138 L 205 170 L 90 170 L 90 192" fill="none" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="3 3"/>
      <path d="M 205 138 L 205 170 L 320 170 L 320 192" fill="none" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="3 3"/>

      <!-- Wave 2: Sinks -->
      <g transform="translate(0, 192)">
        <rect width="180" height="42" rx="4" fill="#311042" stroke="#a855f7" stroke-opacity="0.5"/>
        <text x="12" y="18" class="mono" font-size="9" font-weight="700" fill="#f0abfc">TASK_04: EMIT_EDGE</text>
        <text x="12" y="32" class="mono" font-size="8" fill="#e879f9">In-degree: 1 -> 0 • Wave 2</text>
      </g>

      <g transform="translate(230, 192)">
        <rect width="180" height="42" rx="4" fill="#311042" stroke="#a855f7" stroke-opacity="0.5"/>
        <text x="12" y="18" class="mono" font-size="9" font-weight="700" fill="#f0abfc">TASK_05: AUDIT_LOG</text>
        <text x="12" y="32" class="mono" font-size="8" fill="#e879f9">In-degree: 1 -> 0 • Wave 2</text>
      </g>
    </g>

    <!-- Execution Engine Metrics (Cleanly contained lines) -->
    <g transform="translate(0, 300)">
      <rect width="412" height="48" rx="4" fill="#040810" stroke="#00d4ff" stroke-opacity="0.25"/>
      <text x="12" y="18" class="mono" font-size="8.5" fill="#00d4ff" font-weight="700">DEADLOCK FREEDOM // IN-DEGREE ZERO REDUCTION</text>
      <text x="12" y="34" class="mono" font-size="8" fill="#94a3b8">If processed &lt; total vertices: Trapped before execution.</text>
    </g>
  </g>
</g>
</svg>