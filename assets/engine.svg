<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1000 540" width="1000" height="540">
<defs>
  <linearGradient id="bgCache" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#030508"/>
    <stop offset="50%" stop-color="#0e0705"/>
    <stop offset="100%" stop-color="#04060a"/>
  </linearGradient>

  <linearGradient id="emberGrad" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#ff4400"/>
    <stop offset="50%" stop-color="#ff7700"/>
    <stop offset="100%" stop-color="#ffbb00"/>
  </linearGradient>

  <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
    <feGaussianBlur stdDeviation="3.5" result="coloredBlur"/>
    <feMerge>
      <feMergeNode in="coloredBlur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>

  <pattern id="gridCache" width="24" height="24" patternUnits="userSpaceOnUse">
    <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#ff5500" stroke-width="0.7" stroke-opacity="0.04"/>
  </pattern>
</defs>

<style>
  .mono { font-family: 'JetBrains Mono', 'SF Pro Mono', Menlo, Consolas, monospace; }
  .display { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Arial Black', Impact, sans-serif; font-weight: 800; }
  
  @keyframes sweepLine { 0% { transform: translateY(-5px); } 100% { transform: translateY(545px); } }
  @keyframes blinkLed { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0.15; } }
  
  .scanline { animation: sweepLine 6s linear infinite; }
  .blink { animation: blinkLed 1s infinite; }
</style>

<!-- Canvas Base -->
<rect width="1000" height="540" fill="url(#bgCache)"/>
<rect width="1000" height="540" fill="url(#gridCache)"/>
<rect class="scanline" width="1000" height="2" fill="#ff5500" opacity="0.3"/>

<!-- Hull Frame -->
<polygon points="34,10 966,10 990,34 990,506 966,530 34,530 10,506 10,34" 
         fill="none" stroke="#ff5500" stroke-opacity="0.45" stroke-width="1.5"/>

<!-- Header Section (Balanced typography, clear of top-right badge) -->
<g transform="translate(42, 42)">
  <text class="mono" font-size="11" letter-spacing="2" fill="#ff5500" font-weight="700">// 04. HARDWARE ALIGNMENT &amp; LOW-LEVEL PRIMITIVES</text>
  <text class="display" font-size="21" fill="#ffffff" y="30">SYSTEMS CACHE HIERARCHY &amp; CONCURRENCY</text>
  <text class="mono" font-size="11" fill="#94a3b8" y="50">64-byte aligned structs, zero false-sharing padding &amp; lock-free ring buffers.</text>
</g>

<!-- TOP RIGHT CACHE HIT PILL -->
<g transform="translate(790, 36)">
  <rect width="168" height="24" rx="4" fill="#10b981" fill-opacity="0.12" stroke="#10b981" stroke-opacity="0.5"/>
  <circle cx="12" cy="12" r="3.5" fill="#10b981" class="blink"/>
  <text x="24" y="16" class="mono" font-size="10" font-weight="700" fill="#a7f3d0">L1 CACHE HIT: 99.4%</text>
</g>

<!-- LEFT: CPU CACHE HIERARCHY DIAGRAM -->
<g transform="translate(42, 118)">
  <rect width="440" height="384" rx="8" fill="#040810" stroke="#ff5500" stroke-opacity="0.35" stroke-width="1.2"/>
  
  <g transform="translate(20, 20)">
    <text class="mono" font-size="10" fill="#fed7aa" font-weight="700">CPU MEMORY SUBSYSTEM TOPOLOGY</text>

    <!-- Layer 1: CPU Registers -->
    <g transform="translate(0, 30)">
      <rect width="400" height="42" rx="4" fill="#1e293b" stroke="#ffffff" stroke-opacity="0.1"/>
      <text x="14" y="25" class="mono" font-size="10" font-weight="700" fill="#ffffff">CPU CORE REGISTERS</text>
      <text x="385" y="25" class="mono" font-size="9.5" font-weight="700" fill="#10b981" text-anchor="end">&lt; 1 CYCLE (~0.3 ns)</text>
    </g>

    <!-- Layer 2: L1 Data Cache (64B lines) -->
    <g transform="translate(0, 80)">
      <rect width="400" height="52" rx="4" fill="#0f172a" stroke="#10b981" stroke-opacity="0.5"/>
      <text x="14" y="24" class="mono" font-size="10" font-weight="700" fill="#a7f3d0">L1 DATA CACHE (32 KB)</text>
      <text x="385" y="24" class="mono" font-size="9.5" font-weight="700" fill="#10b981" text-anchor="end">4 CYCLES (~1.0 ns)</text>
      <text x="14" y="42" class="mono" font-size="8.5" fill="#94a3b8">64-byte line alignment • alignas(64) zero false sharing</text>
    </g>

    <!-- Layer 3: L2 Cache -->
    <g transform="translate(0, 140)">
      <rect width="400" height="48" rx="4" fill="#0f172a" stroke="#00d4ff" stroke-opacity="0.4"/>
      <text x="14" y="24" class="mono" font-size="10" font-weight="700" fill="#00d4ff">L2 UNIFIED CACHE (512 KB)</text>
      <text x="385" y="24" class="mono" font-size="9.5" font-weight="700" fill="#00d4ff" text-anchor="end">12 CYCLES (~3.2 ns)</text>
      <text x="14" y="40" class="mono" font-size="8.5" fill="#94a3b8">8-way set associative • Prefetch pipeline optimized</text>
    </g>

    <!-- Layer 4: L3 LLC Cache -->
    <g transform="translate(0, 196)">
      <rect width="400" height="52" rx="4" fill="#1c0e08" stroke="#ff5500" stroke-opacity="0.5"/>
      <text x="14" y="24" class="mono" font-size="10" font-weight="700" fill="#ff7700">L3 LAST LEVEL CACHE (16 MB)</text>
      <text x="385" y="24" class="mono" font-size="9.5" font-weight="700" fill="#ff7700" text-anchor="end">40 CYCLES (~11 ns)</text>
      <text x="14" y="42" class="mono" font-size="8.5" fill="#fed7aa">Lock-free atomic CAS ring buffer shared across cores</text>
    </g>

    <!-- Layer 5: Main Memory DDR5 NUMA -->
    <g transform="translate(0, 256)">
      <rect width="400" height="44" rx="4" fill="#111827" stroke="#ffffff" stroke-opacity="0.1"/>
      <text x="14" y="24" class="mono" font-size="10" font-weight="700" fill="#94a3b8">MAIN MEMORY (DDR5 NUMA)</text>
      <text x="385" y="24" class="mono" font-size="9.5" font-weight="700" fill="#ef4444" text-anchor="end">~60 ns LATENCY</text>
      <text x="14" y="38" class="mono" font-size="8" fill="#64748b">Direct page allocations • Zero-copy socket buffers</text>
    </g>
  </g>
</g>

<!-- RIGHT: 4 SYSTEMS WEAPONS PILLARS -->
<g transform="translate(506, 118)">
  <!-- Pillar 1: Lock-Free Queues -->
  <g transform="translate(0, 0)">
    <polygon points="16,0 452,0 452,80 436,96 0,96 0,16" fill="#070c16" stroke="#ff5500" stroke-opacity="0.45" stroke-width="1.2"/>
    <g transform="translate(20, 18)">
      <text class="display" font-size="14" fill="#ffffff">LOCK-FREE RING BUFFERS</text>
      <text x="0" y="22" class="mono" font-size="9" fill="#ffaa00">std::atomic&lt;uint64_t&gt; acquire / release ordering</text>
      <text x="0" y="40" class="mono" font-size="9" fill="#94a3b8">Zero mutex contention under 100k req/s ingest.</text>
    </g>
  </g>

  <!-- Pillar 2: False Sharing Elimination -->
  <g transform="translate(0, 104)">
    <polygon points="16,0 452,0 452,80 436,96 0,96 0,16" fill="#070c16" stroke="#00d4ff" stroke-opacity="0.45" stroke-width="1.2"/>
    <g transform="translate(20, 18)">
      <text class="display" font-size="14" fill="#ffffff">CACHE CONCURRENCY ISOLATION</text>
      <text x="0" y="22" class="mono" font-size="9" fill="#00d4ff">alignas(hardware_destructive_interference_size)</text>
      <text x="0" y="40" class="mono" font-size="9" fill="#94a3b8">Prevents L1 invalidation storms between threads.</text>
    </g>
  </g>

  <!-- Pillar 3: SIMD Vectorization -->
  <g transform="translate(0, 208)">
    <polygon points="16,0 452,0 452,80 436,96 0,96 0,16" fill="#070c16" stroke="#10b981" stroke-opacity="0.45" stroke-width="1.2"/>
    <g transform="translate(20, 18)">
      <text class="display" font-size="14" fill="#ffffff">AVX-512 &amp; NEON VECTORIZATION</text>
      <text x="0" y="22" class="mono" font-size="9" fill="#10b981">_mm512_load_ps / _mm512_fmadd_ps instructions</text>
      <text x="0" y="40" class="mono" font-size="9" fill="#94a3b8">16x speedup on spatial Euclidean falloff math.</text>
    </g>
  </g>

  <!-- Pillar 4: Zero-Copy IO -->
  <g transform="translate(0, 312)">
    <polygon points="16,0 452,0 452,66 436,80 0,80 0,16" fill="#070c16" stroke="#a855f7" stroke-opacity="0.45" stroke-width="1.2"/>
    <g transform="translate(20, 16)">
      <text class="display" font-size="14" fill="#ffffff">ZERO-COPY KERNEL BYPASS</text>
      <text x="0" y="20" class="mono" font-size="9" fill="#c084fc">sendfile / vmsplice / Linux io_uring rings</text>
      <text x="0" y="38" class="mono" font-size="9" fill="#94a3b8">Direct payload streaming from socket to NIC buffer.</text>
    </g>
  </g>
</g>
</svg>