<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1000 540" width="1000" height="540">
<defs>
  <linearGradient id="bgCache" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#030508"/>
    <stop offset="50%" stop-color="#070b14"/>
    <stop offset="100%" stop-color="#04060a"/>
  </linearGradient>

  <linearGradient id="emberG" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#ff4400"/>
    <stop offset="100%" stop-color="#ffaa00"/>
  </linearGradient>
  <linearGradient id="cyanG" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#00d4ff"/>
    <stop offset="100%" stop-color="#00ffcc"/>
  </linearGradient>

  <pattern id="gridCache" width="24" height="24" patternUnits="userSpaceOnUse">
    <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#ff5500" stroke-width="0.7" stroke-opacity="0.04"/>
  </pattern>

  <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
    <feGaussianBlur stdDeviation="3.5" result="coloredBlur"/>
    <feMerge>
      <feMergeNode in="coloredBlur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>
</defs>

<style>
  .mono { font-family: 'JetBrains Mono', 'SF Pro Mono', Menlo, Consolas, monospace; }
  .display { font-family: 'Arial Black', Impact, 'Trebuchet MS', sans-serif; font-weight: 900; }
  
  @keyframes sweepLine { 0% { transform: translateY(-5px); } 100% { transform: translateY(545px); } }
  @keyframes blinkLed { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0.15; } }
  
  .scanline { animation: sweepLine 6s linear infinite; }
  .blink { animation: blinkLed 1s infinite; }
</style>

<!-- Canvas Base -->
<rect width="1000" height="540" fill="url(#bgCache)"/>
<rect width="1000" height="540" fill="url(#gridCache)"/>
<rect class="scanline" width="1000" height="2" fill="#ff5500" opacity="0.3"/>

<!-- Hull Frame -->
<polygon points="34,10 966,10 990,34 990,506 966,530 34,530 10,506 10,34" 
         fill="none" stroke="#ff5500" stroke-opacity="0.45" stroke-width="1.5"/>

<!-- Header Section -->
<g transform="translate(42, 42)">
  <text class="mono" font-size="11" letter-spacing="2" fill="#ff5500" font-weight="700">// 04. HARDWARE ALIGNMENT &amp; LOW-LEVEL PRIMITIVES</text>
  <text class="display" font-size="28" fill="#ffffff" y="32">C++20 CACHE HIERARCHY &amp; ATOMIC CONCURRENCY</text>
  <text class="mono" font-size="12" fill="#94a3b8" y="54">64-byte aligned structs, zero false-sharing padding &amp; lock-free ring buffers.</text>
</g>

<!-- TOP RIGHT CACHE HIT PILL -->
<g transform="translate(790, 36)">
  <rect width="168" height="24" rx="4" fill="#10b981" fill-opacity="0.12" stroke="#10b981" stroke-opacity="0.5"/>
  <circle cx="12" cy="12" r="3.5" fill="#10b981" class="blink"/>
  <text x="24" y="16" class="mono" font-size="10" font-weight="700" fill="#a7f3d0">L1 CACHE HIT: 99.4%</text>
</g>

<!-- LEFT: CPU CACHE HIERARCHY DIAGRAM (TOTALLY UNIQUE) -->
<g transform="translate(42, 120)">
  <rect width="440" height="380" rx="8" fill="#040810" stroke="#ff5500" stroke-opacity="0.35" stroke-width="1.2"/>
  
  <g transform="translate(20, 20)">
    <text class="mono" font-size="10" fill="#fed7aa" font-weight="700">CPU MEMORY SUBSYSTEM TOPOLOGY</text>

    <!-- Layer 1: CPU Registers -->
    <g transform="translate(0, 30)">
      <rect width="400" height="42" rx="4" fill="#1e293b" stroke="#ffffff" stroke-opacity="0.1"/>
      <text x="14" y="25" class="mono" font-size="10.5" font-weight="700" fill="#ffffff">CPU CORE REGISTERS</text>
      <text x="385" y="25" class="mono" font-size="10" font-weight="700" fill="#10b981" text-anchor="end">&lt; 1 CYCLE (~0.3 ns)</text>
    </g>

    <!-- Layer 2: L1 Data Cache (64B Cache Line) -->
    <g transform="translate(0, 82)">
      <rect width="400" height="52" rx="4" fill="#03253d" stroke="#00d4ff" stroke-opacity="0.5"/>
      <text x="14" y="24" class="mono" font-size="11" font-weight="700" fill="#00ffcc">L1 DATA CACHE (32 KB / Core)</text>
      <text x="14" y="40" class="mono" font-size="9" fill="#94a3b8">alignas(64) struct · 0 False Sharing · 99.4% Hit Rate</text>
      <text x="385" y="24" class="mono" font-size="10" font-weight="700" fill="#00d4ff" text-anchor="end">4 CYCLES (~1.0 ns)</text>
    </g>

    <!-- Layer 3: L2 Unified Cache -->
    <g transform="translate(0, 144)">
      <rect width="400" height="52" rx="4" fill="#1e1b4b" stroke="#a855f7" stroke-opacity="0.5"/>
      <text x="14" y="24" class="mono" font-size="11" font-weight="700" fill="#e9d5ff">L2 UNIFIED CACHE (512 KB / Core)</text>
      <text x="14" y="40" class="mono" font-size="9" fill="#94a3b8">Hardware prefetcher stream buffers · Zero stalls</text>
      <text x="385" y="24" class="mono" font-size="10" font-weight="700" fill="#c084fc" text-anchor="end">14 CYCLES (~3.5 ns)</text>
    </g>

    <!-- Layer 4: L3 Shared LLC -->
    <g transform="translate(0, 206)">
      <rect width="400" height="52" rx="4" fill="#2d1202" stroke="#ff5500" stroke-opacity="0.5"/>
      <text x="14" y="24" class="mono" font-size="11" font-weight="700" fill="#fed7aa">L3 SHARED CACHE (16 MB LLC)</text>
      <text x="14" y="40" class="mono" font-size="9" fill="#94a3b8">Lock-Free atomic compare-and-swap (CAS) ring buffer</text>
      <text x="385" y="24" class="mono" font-size="10" font-weight="700" fill="#ff7700" text-anchor="end">45 CYCLES (~12 ns)</text>
    </g>

    <!-- Layer 5: Main RAM -->
    <g transform="translate(0, 268)">
      <rect width="400" height="52" rx="4" fill="#111827" stroke="#64748b" stroke-opacity="0.4"/>
      <text x="14" y="24" class="mono" font-size="11" font-weight="700" fill="#cbd5e1">MAIN SYSTEM RAM (DDR5 / NUMA)</text>
      <text x="14" y="40" class="mono" font-size="9" fill="#94a3b8">Pre-allocated memory arenas · Zero runtime malloc() in hot path</text>
      <text x="385" y="24" class="mono" font-size="10" font-weight="700" fill="#94a3b8" text-anchor="end">~65 ns</text>
    </g>
  </g>
</g>

<!-- RIGHT: 4 SYSTEMS WEAPON MATRICES -->
<g transform="translate(506, 120)">
  <!-- Pillar 1: Modern C++20 -->
  <g transform="translate(0, 0)">
    <rect width="452" height="85" rx="6" fill="#070c16" stroke="#ff5500" stroke-opacity="0.4" stroke-width="1.2"/>
    <g transform="translate(16, 14)">
      <text x="0" y="14" class="display" font-size="14" fill="#ffffff">MODERN C++20</text>
      <text x="415" y="14" class="mono" font-size="9" font-weight="700" fill="#ffaa00" text-anchor="end">HARDWARE EFFICIENCY</text>
      <text x="0" y="36" class="mono" font-size="10.5" fill="#cbd5e1">Concepts, Coroutines, std::atomic memory_order_acquire/release.</text>
      <text x="0" y="54" class="mono" font-size="10.5" fill="#10b981">✓ SIMD AVX2 vectorized QuickSort partitioning (0 allocations).</text>
    </g>
  </g>

  <!-- Pillar 2: Go Microservices & Network Proxies -->
  <g transform="translate(0, 98)">
    <rect width="452" height="85" rx="6" fill="#070c16" stroke="#00d4ff" stroke-opacity="0.4" stroke-width="1.2"/>
    <g transform="translate(16, 14)">
      <text x="0" y="14" class="display" font-size="14" fill="#ffffff">GO RUNTIMES</text>
      <text x="415" y="14" class="mono" font-size="9" font-weight="700" fill="#00d4ff" text-anchor="end">HIGH-CONCURRENCY</text>
      <text x="0" y="36" class="mono" font-size="10.5" fill="#cbd5e1">Goroutines, sync.Pool buffer reuse, epoll/kqueue network poller.</text>
      <text x="0" y="54" class="mono" font-size="10.5" fill="#00d4ff">✓ HyperRoute Edge Gateway: 120,000 rps burst, sub-2.8ms p99.</text>
    </g>
  </g>

  <!-- Pillar 3: Python 3.12 & DAG Runtimes -->
  <g transform="translate(0, 196)">
    <rect width="452" height="85" rx="6" fill="#070c16" stroke="#a855f7" stroke-opacity="0.4" stroke-width="1.2"/>
    <g transform="translate(16, 14)">
      <text x="0" y="14" class="display" font-size="14" fill="#ffffff">PYTHON 3.12 (ASYNCIO)</text>
      <text x="415" y="14" class="mono" font-size="9" font-weight="700" fill="#c084fc" text-anchor="end">DAG TOPOLOGICAL</text>
      <text x="0" y="36" class="mono" font-size="10.5" fill="#cbd5e1">Kahn's Topological Sort Algorithm, wave schedulers, cycle checks.</text>
      <text x="0" y="54" class="mono" font-size="10.5" fill="#a855f7">✓ AgentForge DAG Engine: zero deadlocks, automated retry trees.</text>
    </g>
  </g>

  <!-- Pillar 4: Embedded Firmware & Telemetry -->
  <g transform="translate(0, 294)">
    <rect width="452" height="85" rx="6" fill="#070c16" stroke="#10b981" stroke-opacity="0.4" stroke-width="1.2"/>
    <g transform="translate(16, 14)">
      <text x="0" y="14" class="display" font-size="14" fill="#ffffff">EMBEDDED &amp; RF SYSTEMS</text>
      <text x="415" y="14" class="mono" font-size="9" font-weight="700" fill="#10b981" text-anchor="end">REAL-TIME AVIONICS</text>
      <text x="0" y="36" class="mono" font-size="10.5" fill="#cbd5e1">FreeRTOS, ESP32, 433.92 MHz UHF transceivers, I2C/SPI buses.</text>
      <text x="0" y="54" class="mono" font-size="10.5" fill="#10b981">✓ BMP280 barometer &amp; MPU6050 6-DOF IMU descent telemetry.</text>
    </g>
  </g>
</g>
</svg>