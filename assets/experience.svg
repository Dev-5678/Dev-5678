    <text x="0" y="82" class="mono" font-size="10" fill="#cbd5e1">• Engineered multi-agent topological DAG schedulers, RAG vector retrieval pipelines, and low-level memory runtimes.</text>
    <text x="0" y="98" class="mono" font-size="10" fill="#10b981">✓ 72/72 unit test suites verified in production CI matrix; verified zero memory leaks across 100k requests.</text>
