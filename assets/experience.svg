  <g transform="translate(20, 16)">
    <!-- Log Number & Callsign -->
    <rect width="70" height="20" rx="3" fill="#00d4ff" fill-opacity="0.15" stroke="#00d4ff" stroke-opacity="0.4"/>
    <text x="35" y="14" class="mono" font-size="8.5" font-weight="700" fill="#00ffcc" text-anchor="middle">LOG 01</text>
    <rect x="78" width="112" height="20" rx="3" fill="#1e293b"/>
    <text x="134" y="14" class="mono" font-size="8.5" font-weight="700" fill="#94a3b8" text-anchor="middle">ICAO: VIDP [DEL]</text>
    <rect x="198" width="138" height="20" rx="3" fill="#10b981" fill-opacity="0.12"/>
    <text x="267" y="14" class="mono" font-size="8.5" font-weight="700" fill="#a7f3d0" text-anchor="middle">FL320 ANS RADAR</text>

    <!-- REAL-WORLD EXACT DATES -->
    <text x="730" y="15" class="mono" font-size="10" font-weight="700" fill="#00d4ff">14 AUG 2026 – 25 SEP 2026</text>

