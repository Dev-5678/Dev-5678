    <text x="0" y="62" class="mono" font-size="11" font-weight="700" fill="#00d4ff">CNS/ATM Division · Flight Radar Network Segregation Intern · New Delhi / NCR</text>
    <text x="0" y="82" class="mono" font-size="10" fill="#cbd5e1">• Segregated Northern Region administrative network from mission-critical Air Navigation Services (ANS) radar feeds.</text>
    <text x="0" y="98" class="mono" font-size="10" fill="#10b981">✓ Zero broadcast packet loops achieved across VHF communication bridges under 99.98% operational uptime SLA.</text>
  </g>
</g>

